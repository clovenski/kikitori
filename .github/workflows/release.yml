name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Tag matches package.json
        shell: bash
        # The updater compares the version in latest.yml (built from package.json) with the installed one.
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:installer
      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem Kikitori-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The hand-written notes come first; the generated list of changes is appended after them.
          sed "s/VERSION/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          # latest.yml and the .blockmap are what installed copies read to find and fetch the update.
          gh release create "$GITHUB_REF_NAME" dist/Kikitori-Setup-*.exe dist/Kikitori-Setup-*.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt \
            --title "Kikitori ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
